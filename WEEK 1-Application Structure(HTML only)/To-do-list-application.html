<!DOCTYPE html>
<html>
    <head>
        <title>To-Do List Application</title>
        <link rel="stylesheet" href="style.css">
        <script src="MuhammadAhmadBajwa-Task4-JavaScript.js" defer></script>
    </head>
    <body>
        <div id="toast"></div>

        <header id="header"><h1>Task Manager</h1>
            <p>Manage your Daily Tasks Easily</p>
        </header>

        <section id="add-task">
            <h2>Add new Task</h2>
            <form>
                <label for="TaskName">Task Name:</label>
                <input type="text" id="TaskName" name="TaskName" placeholder="Enter task name"></br></br>

                <label for="TaskPriority">Priority</label>
                <select id="TaskPriority" name="TaskPriority">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select><br><br>

                <label for="TaskCategory">Task Category:</label>
                <input type="text" id="TaskCategory" name="TaskCategory" placeholder="e.g: Programming"></br></br>

                <label for="DueDate">Due Date:</label>
                <input type="date" id="DueDate" name="DueDate"></br></br>

                <button type="submit">Add Task</button>
            </form>
        </section>

        <section id="task-list">
            <h2>Task List</h2>
            <ul>              
            </ul>
        </section>
        
        <section id="task-status">
            <h2>Task Status</h2>
                <ul>
                    <h3><li class="pending">Pending: <span  id="pendingBadge">0</span></li></h3>

                    <h3><li class="completed">Completed: <span id="completedBadge">0</span></li></h3>

                    <h3><li class="inprogress">In Progress: <span id="inprogressBadge">0</span></li></h3>
                </ul>
        </section>

        <section id="feedback">
            <h2>Feedback</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name"></br></br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter a valid email"></br></br>

                <label for="feedback">Feedback:</label>
                <textarea id="feedback" name="feedback" rows="5" cols="50" placeholder="Enter your feedback"></textarea></br></br>

                <button type="submit">Submit</button>
            </form>
        </section>

        <footer id="footer"><p>&copy; To-Do List Application. All rights reserved.</p></footer>
    </body>
</html>
